name: Maintenance

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  run:
    name: Run scheduled maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call maintenance endpoint
        run: |
          response=$(curl -fsS -X POST "${{ vars.API_URL }}/api/v1/internal/maintenance/run" \
            -H "x-maintenance-token: ${{ secrets.MAINTENANCE_TOKEN }}" \
            --retry 5 \
            --retry-delay 15 \
            --retry-connrefused \
            --max-time 90)

          echo "$response"

          echo "$response" | jq -e '(.tasks | type == "array") and (.tasks | all(.status != "FAILED"))' > /dev/null || {
            echo "Maintenance response is invalid or a task reported FAILED"
            exit 1
          }
