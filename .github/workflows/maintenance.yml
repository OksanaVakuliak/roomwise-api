name: Maintenance

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  run:
    name: Run scheduled maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call maintenance endpoint
        run: |
          response=$(curl -fsS -X POST "${{ vars.API_URL }}/api/v1/internal/maintenance/run" \
            -H "x-maintenance-token: ${{ secrets.MAINTENANCE_TOKEN }}" \
            --retry 5 \
            --retry-delay 15 \
            --retry-all-errors \
            --max-time 90)

          echo "$response"

          if echo "$response" | jq -e '.tasks | any(.status == "FAILED")' > /dev/null; then
            echo "A maintenance task reported FAILED"
            exit 1
          fi
