name: Publish calc-engine

on:
  push:
    tags:
      - 'calc-engine@*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Test, build, publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#calc-engine@}"
          package_version="$(node -p "require('./packages/calc-engine/package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version $tag_version does not match packages/calc-engine/package.json version $package_version" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @roomwise/calc-engine test

      - name: Build
        run: pnpm --filter @roomwise/calc-engine build

      - name: Publish
        working-directory: packages/calc-engine
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
