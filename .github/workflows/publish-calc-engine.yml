name: Publish calc-engine

on:
  push:
    tags:
      - 'calc-engine@*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Test, build, publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag points to main
        run: |
          git fetch --no-tags origin main
          if ! git rev-list --first-parent origin/main | grep -qx "$GITHUB_SHA"; then
            echo "Tag $GITHUB_REF_NAME must point to a commit on main" >&2
            exit 1
          fi

      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#calc-engine@}"
          package_version="$(node -p "require('./packages/calc-engine/package.json').version")"
          if ! echo "$tag_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag version $tag_version must be a stable X.Y.Z release" >&2
            exit 1
          fi
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version $tag_version does not match packages/calc-engine/package.json version $package_version" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome ci packages/calc-engine

      - name: Typecheck
        run: pnpm --filter @roomwise/calc-engine typecheck

      - name: Test
        run: pnpm --filter @roomwise/calc-engine test:coverage

      - name: Build
        run: pnpm --filter @roomwise/calc-engine build

      - name: Publish with trusted publishing
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        working-directory: packages/calc-engine
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ''

      - name: Publish with token
        if: vars.NPM_TRUSTED_PUBLISHING != 'true'
        working-directory: packages/calc-engine
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Set the NPM_TOKEN secret, or enable trusted publishing with the NPM_TRUSTED_PUBLISHING variable" >&2
            exit 1
          fi
          npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
