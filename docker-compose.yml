services:
  postgres:
    image: postgres:17
    container_name: roomwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: roomwise
      POSTGRES_PASSWORD: roomwise
      POSTGRES_DB: roomwise
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomwise -d roomwise"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
